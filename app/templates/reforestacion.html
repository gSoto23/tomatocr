<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reporte de Reforestación | TOMATO</title>
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="57x57" href="/static/images/fav/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/static/images/fav/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/static/images/fav/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/static/images/fav/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/static/images/fav/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/static/images/fav/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/static/images/fav/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/images/fav/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/fav/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/fav/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/fav/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/static/images/fav/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/images/fav/favicon-16x16.png">
    <link rel="manifest" href="/static/images/fav/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/static/images/fav/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class" };
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <style>
        #map { height: 600px; width: 100%; border-radius: 0.5rem; z-index: 10; }
        
        /* Custom MarkerCluster Styles to match brand (green) */
        .marker-cluster-small {
            background-color: rgba(34, 197, 94, 0.6);
        }
        .marker-cluster-small div {
            background-color: rgba(21, 128, 61, 0.9);
            color: white;
        }
        .marker-cluster-medium {
            background-color: rgba(34, 197, 94, 0.6);
        }
        .marker-cluster-medium div {
            background-color: rgba(21, 128, 61, 0.9);
            color: white;
        }
        .marker-cluster-large {
            background-color: rgba(34, 197, 94, 0.6);
        }
        .marker-cluster-large div {
            background-color: rgba(21, 128, 61, 0.9);
            color: white;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 antialiased" x-data="reforestationApp()">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 border-b border-black/10 bg-white/90 backdrop-blur">
        <div class="mx-auto max-w-7xl px-4 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <img src="/static/images/LogoTomatoB.png" alt="TOMATO" class="h-8" />
            </a>
            <a href="/" class="text-sm font-semibold hover:opacity-70 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Volver al inicio
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold tracking-tight" x-text="selectedClient === 'all' ? 'Reporte Nacional de Reforestación' : selectedClient"></h1>
            <p class="mt-2 text-gray-600">Reporte en vivo de árboles plantados, inventario y georreferenciación.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Dashboard Controls -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Filtro -->
                <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm space-y-4">
                    <div>
                        <label for="clientFilter" class="block text-sm font-semibold text-gray-700 mb-2">Filtrar por Cliente</label>
                        <select id="clientFilter" x-model="selectedClient" @change="onClientChange()" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm outline-none focus:border-black focus:ring-1 focus:ring-black">
                            <option value="all">Ver Todos</option>
                            <template x-for="c in clients" :key="c">
                                <option :value="c" x-text="c"></option>
                            </template>
                        </select>
                    </div>
                    
                    <div>
                        <label for="sectorFilter" class="block text-sm font-semibold text-gray-700 mb-2">Filtrar por Locación</label>
                        <select id="sectorFilter" x-model="selectedSector" @change="applyFilters()" :disabled="selectedClient === 'all'" class="w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm outline-none focus:border-black focus:ring-1 focus:ring-black disabled:bg-gray-100 disabled:text-gray-400">
                            <option value="all">Todas las locaciones</option>
                            <template x-for="s in availableSectors" :key="s">
                                <option :value="s" x-text="s"></option>
                            </template>
                        </select>
                    </div>
                </div>

                <!-- Métricas -->
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col items-center text-center">
                    <div class="text-sm font-semibold text-gray-500 uppercase tracking-widest">Árboles Sembrados</div>
                    
                    <div x-show="isLoading" class="mt-4 animate-pulse flex space-x-4">
                        <div class="h-10 w-24 bg-gray-200 rounded"></div>
                    </div>
                    
                    <div x-show="!isLoading" class="mt-2 text-5xl font-extrabold text-green-600" x-text="totalTrees">0</div>
                    <div x-show="!isLoading" class="mt-2 text-sm text-gray-600">registrados en el área</div>
                </div>

                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100 hidden md:block">
                    <h3 class="font-semibold text-blue-900 text-sm">Agrupación (Clusters)</h3>
                    <p class="mt-2 text-sm text-blue-800 opacity-90">Los árboles en la misma coordenada se agrupan en un globo verde indicando la cantidad. Haz clic para expandirlos.</p>
                </div>
            </div>

            <!-- Mapa -->
            <div class="lg:col-span-3 relative">
                <div x-show="isLoading" class="absolute inset-0 z-20 bg-white/70 backdrop-blur-sm flex items-center justify-center rounded-xl">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-600"></div>
                </div>
                <div class="bg-white p-2 rounded-xl border border-gray-200 shadow-sm">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('reforestationApp', () => ({
                allTrees: [],
                
                clients: [],
                selectedClient: 'all',
                
                availableSectors: [],
                selectedSector: 'all',
                
                totalTrees: 0,
                map: null,
                markerClusterGroup: null,
                isLoading: true,
                
                async init() {
                    this.map = L.map('map').setView([10.0, -84.0], 9);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors'
                    }).addTo(this.map);

                    this.markerClusterGroup = L.markerClusterGroup({
                        spiderfyOnMaxZoom: true,
                        showCoverageOnHover: false,
                        zoomToBoundsOnClick: true,
                        maxClusterRadius: 40
                    });
                    this.map.addLayer(this.markerClusterGroup);

                    await this.fetchData();
                },

                async fetchData() {
                    this.isLoading = true;
                    try {
                        const response = await fetch('/api/reforestation/map-data');
                        const data = await response.json();
                        this.allTrees = data.trees || [];
                        
                        // Extract unique clients
                        const clientSet = new Set();
                        this.allTrees.forEach(t => {
                            if(t.project) clientSet.add(t.project);
                        });
                        this.clients = Array.from(clientSet).sort();
                        
                        // Default to Municipalidad de Alajuela if present
                        if(this.clients.includes("Municipalidad de Alajuela")) {
                            this.selectedClient = "Municipalidad de Alajuela";
                        } else if (this.clients.length > 0) {
                            this.selectedClient = this.clients[0];
                        }
                        
                        this.onClientChange();
                    } catch(e) {
                        console.error('Error fetching tree data:', e);
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                onClientChange() {
                    // Reset sector selection
                    this.selectedSector = 'all';
                    
                    // Populate sectors based on selected client
                    if(this.selectedClient === 'all') {
                        this.availableSectors = [];
                    } else {
                        const sectorSet = new Set();
                        this.allTrees
                            .filter(t => t.project === this.selectedClient)
                            .forEach(t => { if(t.sector) sectorSet.add(t.sector) });
                        this.availableSectors = Array.from(sectorSet).sort();
                    }
                    
                    this.applyFilters();
                },

                applyFilters() {
                    let filtered = this.allTrees;
                    
                    if (this.selectedClient !== 'all') {
                        filtered = filtered.filter(t => t.project === this.selectedClient);
                    }
                    
                    if (this.selectedSector !== 'all') {
                        filtered = filtered.filter(t => t.sector === this.selectedSector);
                    }
                    
                    this.totalTrees = filtered.length;
                    this.renderMarkers(filtered);
                },

                renderMarkers(treesToRender) {
                    this.markerClusterGroup.clearLayers();
                    
                    if (treesToRender.length === 0) return;

                    let bounds = L.latLngBounds();
                    const markers = [];

                    treesToRender.forEach(tree => {
                        const marker = L.circleMarker([tree.lat, tree.lng], {
                            radius: 6,
                            fillColor: "#16a34a",
                            color: "#ffffff",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.9
                        });
                        
                        marker.bindPopup(`
                            <div class="text-sm p-2 min-w-[220px]">
                                <div class="font-bold border-b pb-1 mb-2 text-green-700 uppercase tracking-wide text-xs">Árbol #${tree.id}</div>
                                <div class="space-y-2">
                                    <div>
                                        <div class="text-gray-500 text-[10px] uppercase font-semibold">Especie</div>
                                        <div class="font-medium text-gray-900 leading-tight">${tree.species}</div>
                                    </div>
                                    <div>
                                        <div class="text-gray-500 text-[10px] uppercase font-semibold">Locación</div>
                                        <div class="font-medium text-gray-900 leading-tight">${tree.sector}</div>
                                    </div>
                                    <div>
                                        <div class="text-gray-500 text-[10px] uppercase font-semibold">Fecha Plantado</div>
                                        <div class="font-medium text-gray-900 leading-tight">${tree.date || 'N/A'}</div>
                                    </div>
                                </div>
                            </div>
                        `);
                        
                        markers.push(marker);
                        bounds.extend([tree.lat, tree.lng]);
                    });

                    this.markerClusterGroup.addLayers(markers);

                    if (treesToRender.length > 0) {
                        this.map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
                    }
                }
            }));
        });
    </script>
</body>
</html>
