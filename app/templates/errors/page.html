{% extends "public_base.html" %}

{% block title %}{{ title }} | TOMATO{% endblock %}
{% block head %}<meta name="robots" content="noindex" />{% endblock %}

{% block content %}
<div class="mx-auto max-w-md space-y-4 py-10 text-center">
    <p class="text-sm font-semibold uppercase tracking-wide text-black/50 dark:text-white/50">Error {{ status_code }}</p>
    <h1 class="text-2xl font-semibold">{{ title }}</h1>
    <p class="text-black/70 dark:text-white/70">{{ message }}</p>
    <div class="flex flex-col gap-2 sm:flex-row sm:justify-center">
        <a href="javascript:history.back()" class="rounded-md border border-black/20 px-5 py-3 text-sm font-semibold dark:border-white/20">Volver</a>
        <a href="/dashboard" class="rounded-md bg-black px-5 py-3 text-sm font-semibold text-white dark:bg-white dark:text-black">Ir al Dashboard</a>
    </div>
</div>
{% endblock %}
